name: Daily Auto Commit

on:
  schedule:
    # Backup slots para bisan ug delayed/dropped ang usa, naa pay lain.
    # Offset minutes (dili :00) kay high-load ang top-of-hour sa GitHub.
    # 12:07 AM, 12:37 AM, 2:07 AM, 6:23 AM, 12:23 PM, 6:23 PM (PHT)
    - cron: '7 16 * * *'
    - cron: '37 16 * * *'
    - cron: '7 18 * * *'
    - cron: '23 22 * * *'
    - cron: '23 4 * * *'
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit
  cancel-in-progress: false

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already committed today
        id: check
        run: |
          today=$(date +%Y-%m-%d)
          last=$(git log --grep='auto push' -1 --format='%cd' --date=format-local:'%Y-%m-%d')
          if [ "$last" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already pushed today ($today), skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No push yet today ($today)."
          fi

      - name: Increment cheat counter
        if: steps.check.outputs.skip == 'false'
        id: counter
        run: |
          line=$(grep -m1 'git commit -m "cheat:' README.md)
          tens=$(echo "$line" | grep -oE '\[[0-9]+\]' | sed -n 1p | tr -d '[]')
          units=$(echo "$line" | grep -oE '\[[0-9]+\]' | sed -n 2p | tr -d '[]')
          units=$((units + 1))
          if [ "$units" -gt 9 ]; then
            units=0
            tens=$((tens + 1))
          fi
          new="[$tens][$units]"
          sed -i "s/cheat: \[[0-9]*\]\[[0-9]*\]/cheat: ${new}/" README.md
          echo "counter=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and Push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "xcell321"
          git config user.email "edsielursal39@gmail.com"
          git add README.md
          # I-force ang timestamp ngadto sa 12:00 AM PHT sa today,
          # bisan pa ug delayed mo-run ang workflow (GitHub cron lag).
          midnight="$(date -d "$(date +%Y-%m-%d) 00:00:00" --iso-8601=seconds)"
          GIT_AUTHOR_DATE="$midnight" GIT_COMMITTER_DATE="$midnight" \
            git commit -m "cheat${{ steps.counter.outputs.counter }}: auto push (busy day)" || exit 0
          git push
